<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>FormulaAI — Get Excel & Google Sheets Formulas Instantly</title>
    <meta name="description" content="Paste your table, ask a question in plain English, and get the exact Excel or Google Sheets formula you need. No extensions, no data stored. Free to use." />
    <meta name="keywords" content="Excel formula generator, Google Sheets formula, VLOOKUP helper, SUMIF formula, spreadsheet formula AI, formula generator" />
    <link rel="canonical" href="https://formulamagic.netlify.app/" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://formulamagic.netlify.app/" />
    <meta property="og:title" content="FormulaAI — Get Excel & Google Sheets Formulas Instantly" />
    <meta property="og:description" content="Paste your table, ask a question in plain English, and get the exact formula you need. No extensions, no data stored." />
    <meta property="og:site_name" content="FormulaAI" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FormulaAI — Get Excel & Google Sheets Formulas Instantly" />
    <meta name="twitter:description" content="Paste your table, ask a question in plain English, and get the exact formula you need. No extensions, no data stored." />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FormulaAI",
      "url": "https://formulamagic.netlify.app/",
      "description": "Paste your spreadsheet table, ask a question in plain English, and get the exact Excel or Google Sheets formula instantly. No extensions required, no data stored.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Excel formula generation",
        "Google Sheets formula generation",
        "VLOOKUP, SUMIF, COUNTIF, INDEX-MATCH support",
        "Multi-header table support",
        "No data stored or shared"
      ]
    }
    </script>

    <!-- Structured data: FAQPage for AEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I get an Excel formula using AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Copy your table from Excel, paste it into FormulaAI, type your question in plain English, and get the exact formula instantly. No Excel plugin or extension needed."
          }
        },
        {
          "@type": "Question",
          "name": "Is my spreadsheet data safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. FormulaAI only sends your question and a small table sample to generate the formula. Your data is never stored or shared."
          }
        },
        {
          "@type": "Question",
          "name": "Does FormulaAI work with Google Sheets?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can choose between Excel and Google Sheets formula syntax. FormulaAI returns the correct formula for whichever app you select."
          }
        },
        {
          "@type": "Question",
          "name": "What kind of formulas can FormulaAI generate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FormulaAI can generate SUMIF, COUNTIF, AVERAGEIF, VLOOKUP, XLOOKUP, INDEX-MATCH, IF, IFS, nested formulas, date calculations, text formulas, and more."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
